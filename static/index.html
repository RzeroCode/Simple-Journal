<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <div class="top">
    <span id="who"></span>
    <div class="top-actions">
      <a class="link" href="/api/export?format=md" download aria-label="Download all entries as Markdown">Export .md</a>
      <a class="link" href="/api/export?format=json" download aria-label="Download all entries as JSON">Export .json</a>
      <button type="button" class="link" id="logout">Log out</button>
    </div>
  </div>
  <h1>Daily Journal</h1>
  <p class="sub">Pick a day, write a thought. Click an entry to open or edit it.</p>

  <form class="panel" id="form">
    <div class="row">
      <label for="date">Date</label>
      <input type="date" id="date" required>
      <button type="button" class="link" id="today">Today</button>
    </div>
    <label for="text" class="sr">What's on your mind?</label>
    <textarea id="text" placeholder="Write something..." required maxlength="10000"></textarea>
    <div class="actions">
      <span class="hint">Ctrl + Enter to save</span>
      <button type="submit" id="add">Add entry</button>
    </div>
    <p class="error" id="error" role="alert"></p>
  </form>

  <section class="panel calendar" aria-label="Calendar">
    <div class="cal-head">
      <button type="button" class="link cal-nav" id="calPrev" aria-label="Previous month">‹</button>
      <span id="calTitle" aria-live="polite"></span>
      <button type="button" class="link cal-nav" id="calNext" aria-label="Next month">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <div class="search">
    <label for="q" class="sr">Search all entries</label>
    <input type="search" id="q" placeholder="Search all entries..." maxlength="200" autocomplete="off">
  </div>

  <h2 id="heading"></h2>
  <div class="cards" id="cards" aria-live="polite"></div>
</main>

<dialog id="viewer" aria-labelledby="vDate">
  <div class="viewer-panel">
    <div class="viewer-head">
      <div>
        <h3 id="vDate"></h3>
        <p id="vTime"></p>
      </div>
      <button type="button" class="viewer-close" id="vClose" aria-label="Close">×</button>
    </div>
    <p class="viewer-text" id="vText"></p>
    <label for="vEdit" class="sr">Edit entry</label>
    <textarea class="viewer-edit" id="vEdit" maxlength="10000" hidden></textarea>
    <p class="error" id="vError" role="alert"></p>
    <div class="viewer-actions">
      <button type="button" class="danger" id="vDelete">Delete entry</button>
      <span class="hint" id="vHint" hidden>Ctrl + Enter to save · Esc to cancel</span>
      <button type="button" class="link" id="vCancel" hidden>Cancel</button>
      <button type="button" id="vEditBtn">Edit</button>
      <button type="button" id="vSave" hidden>Save</button>
    </div>
  </div>
</dialog>

<script src="/static/journal.js"></script>
</body>
</html>
