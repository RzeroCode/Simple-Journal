<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; color: var(--muted); font-size: .9rem; }
  .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); align-items: start; }
  .card {
    position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 18px 18px 14px; border-top: 4px solid var(--c);
    animation: pop .25s ease-out; cursor: pointer;
    transition: transform .15s, background-color .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); background-color: rgba(255,255,255,0.15); box-shadow: 0 12px 30px rgba(0,0,0,.25); }
  .card .body { all: unset; display: block; cursor: pointer; padding-right: 18px; }
  .card .body:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 6px; }
  .preview {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; line-clamp: 6;
    overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .card time { display: block; font-size: .75rem; color: var(--muted); margin-top: 12px; }
  .card .del {
    position: absolute; top: 8px; right: 8px; background: none; color: var(--muted);
    padding: 2px 8px; font-size: 1.1rem; line-height: 1;
  }
  .card .del:hover { color: #fff; transform: none; }
  .empty { color: var(--muted); text-align: center; padding: 32px; border: 1px dashed var(--border); border-radius: 18px; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }

  /* Expanded entry */
  #viewer {
    padding: 0; border: 0; background: none; color: var(--text); overflow: visible;
    width: min(680px, calc(100vw - 32px)); max-width: none; max-height: calc(100vh - 64px);
  }
  #viewer::backdrop { background: rgba(15, 10, 40, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body:has(#viewer[open]) { overflow: hidden; }
  .viewer-panel {
    display: flex; flex-direction: column; max-height: calc(100vh - 64px);
    background: rgba(52, 30, 112, .94); border: 1px solid var(--border); border-top: 4px solid var(--c);
    border-radius: 22px; padding: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.45);
  }
  .viewer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .viewer-head h3 { font-family: Fraunces, Georgia, serif; font-size: 1.4rem; margin: 0; }
  .viewer-head p { color: var(--muted); font-size: .85rem; margin: 4px 0 0; }
  .viewer-close { background: none; color: var(--muted); font-size: 1.6rem; line-height: 1; padding: 0 6px; }
  .viewer-close:hover { color: #fff; transform: none; }
  .viewer-text { white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; scrollbar-color: rgba(255,255,255,.3) transparent; font-size: 1.05rem; line-height: 1.65; margin: 18px 0 20px; }
  .viewer-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #vDelete, #vHint { margin-right: auto; }
  .viewer-edit {
    width: 100%; margin: 18px 0 0; font-size: 1.05rem; line-height: 1.65; resize: vertical;
    field-sizing: content; min-height: 160px; max-height: 55vh;
  }
  .danger { background: none; color: var(--error); border: 1px solid rgba(254,202,202,.4); }
  .danger:hover { background: rgba(254,202,202,.1); }

  ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) {
    animation-duration: .38s; animation-timing-function: cubic-bezier(.2, .9, .25, 1);
  }
  /* Fade the old snapshot out quickly so the scaled-up text doesn't linger while the box grows. */
  ::view-transition-old(entry) { animation-duration: .12s; }
  ::view-transition-new(entry) { animation-duration: .24s; }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; transition: none; } }
</style>
</head>
<body>
<main>
  <div class="top">
    <span id="who"></span>
    <button type="button" class="link" id="logout">Log out</button>
  </div>
  <h1>Daily Journal</h1>
  <p class="sub">Pick a day, write a thought. Click an entry to open or edit it.</p>

  <form class="panel" id="form">
    <div class="row">
      <label for="date">Date</label>
      <input type="date" id="date" required>
      <button type="button" class="link" id="today">Today</button>
    </div>
    <label for="text" class="sr">What's on your mind?</label>
    <textarea id="text" placeholder="Write something..." required maxlength="10000"></textarea>
    <div class="actions">
      <span class="hint">Ctrl + Enter to save</span>
      <button type="submit" id="add">Add entry</button>
    </div>
    <p class="error" id="error" role="alert"></p>
  </form>

  <h2 id="heading"></h2>
  <div class="cards" id="cards" aria-live="polite"></div>
</main>

<dialog id="viewer" aria-labelledby="vDate">
  <div class="viewer-panel">
    <div class="viewer-head">
      <div>
        <h3 id="vDate"></h3>
        <p id="vTime"></p>
      </div>
      <button type="button" class="viewer-close" id="vClose" aria-label="Close">×</button>
    </div>
    <p class="viewer-text" id="vText"></p>
    <label for="vEdit" class="sr">Edit entry</label>
    <textarea class="viewer-edit" id="vEdit" maxlength="10000" hidden></textarea>
    <p class="error" id="vError" role="alert"></p>
    <div class="viewer-actions">
      <button type="button" class="danger" id="vDelete">Delete entry</button>
      <span class="hint" id="vHint" hidden>Ctrl + Enter to save · Esc to cancel</span>
      <button type="button" class="link" id="vCancel" hidden>Cancel</button>
      <button type="button" id="vEditBtn">Edit</button>
      <button type="button" id="vSave" hidden>Save</button>
    </div>
  </div>
</dialog>

<script>
  const COLORS = ['#f472b6', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa', '#fb7185'];
  const $ = id => document.getElementById(id);
  const viewer = $('viewer');
  let openCard = null, openEntryData = null;

  // Local date, not toISOString(), which is UTC and can give yesterday's date.
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  const longDate = date => new Date(date + 'T00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  const shortTime = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  async function api(path, options = {}) {
    const res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
    if (res.status === 401) { location.replace('/login'); throw new Error('Not logged in'); }
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(typeof body.detail === 'string' ? body.detail : 'Something went wrong. Please try again.');
    }
    return res.status === 204 ? null : res.json();
  }

  const showError = err => { $('error').textContent = err ? err.message || String(err) : ''; };

  async function deleteEntry(id) {
    try { await api(`/api/entries/${id}`, { method: 'DELETE' }); showError(null); render(); }
    catch (err) { showError(err); }
  }

  // Animates the DOM change with the View Transitions API where supported; otherwise applies it instantly.
  function animate(update) {
    if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      update();
      return Promise.resolve();
    }
    return document.startViewTransition(update).finished;
  }

  // The shared view-transition-name moves from the card to the dialog, so the card morphs into it.
  function openEntry(card, entry, color) {
    if (viewer.open) return;
    openCard = card;
    openEntryData = entry;
    viewer.style.setProperty('--c', color);
    $('vDate').textContent = longDate(entry.date);
    $('vTime').textContent = `Written at ${shortTime(entry.created_at)}`;
    $('vText').textContent = entry.text;
    setEditing(false);
    card.style.viewTransitionName = 'entry';
    animate(() => {
      card.style.viewTransitionName = '';
      viewer.style.viewTransitionName = 'entry';
      viewer.showModal();
      $('vText').scrollTop = 0;
    });
  }

  function closeViewer() {
    if (!viewer.open) return;
    const card = openCard && openCard.isConnected ? openCard : null;
    animate(() => {
      viewer.close();
      viewer.style.viewTransitionName = '';
      if (card) card.style.viewTransitionName = 'entry';
    }).then(() => {
      if (!card) return;
      card.style.viewTransitionName = '';
      card.querySelector('.body').focus({ preventScroll: true });
    });
  }

  // ----- editing inside the expanded view -----
  let editing = false;
  const hasUnsavedEdit = () => editing && $('vEdit').value.trim() !== openEntryData.text;
  const okToDiscard = () => !hasUnsavedEdit() || confirm('Discard your changes?');

  function setEditing(on) {
    editing = on;
    $('vText').hidden = on;
    $('vEdit').hidden = !on;
    $('vDelete').hidden = $('vEditBtn').hidden = on;
    $('vSave').hidden = $('vCancel').hidden = $('vHint').hidden = !on;
    $('vError').textContent = '';
    if (on) {
      $('vEdit').value = openEntryData.text;
      $('vEdit').focus();
    }
  }

  function cancelEdit() {
    if (!okToDiscard()) return;
    setEditing(false);
    $('vEditBtn').focus();
  }

  async function saveEdit() {
    const text = $('vEdit').value.trim();
    if (!text) return $('vError').textContent = "An entry can't be empty.";
    if (text === openEntryData.text) return cancelEdit();
    $('vSave').disabled = true;
    try {
      const updated = await api(`/api/entries/${openEntryData.id}`, { method: 'PATCH', body: JSON.stringify({ text }) });
      openEntryData.text = updated.text; // same object the card's click handler holds
      $('vText').textContent = updated.text;
      if (openCard && openCard.isConnected) openCard.querySelector('.preview').textContent = updated.text;
      setEditing(false);
      $('vEditBtn').focus();
    } catch (err) {
      $('vError').textContent = err.message;
    } finally {
      $('vSave').disabled = false;
    }
  }

  $('vEditBtn').onclick = () => setEditing(true);
  $('vSave').onclick = saveEdit;
  $('vCancel').onclick = cancelEdit;
  $('vEdit').onkeydown = ev => { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) saveEdit(); };

  viewer.addEventListener('cancel', ev => { ev.preventDefault(); editing ? cancelEdit() : closeViewer(); }); // Esc
  viewer.addEventListener('close', () => { viewer.style.viewTransitionName = ''; });  // closed by any route
  viewer.onclick = ev => { if (ev.target === viewer && !editing) closeViewer(); };   // backdrop; ignored mid-edit so a stray click can't lose text
  $('vClose').onclick = () => { if (okToDiscard()) closeViewer(); };
  $('vDelete').onclick = () => { viewer.close(); deleteEntry(openEntryData.id); };

  async function render() {
    const date = $('date').value;
    $('heading').textContent = date === todayStr() ? `Today · ${longDate(date)}` : longDate(date);

    let list;
    try { list = await api(`/api/entries?date=${encodeURIComponent(date)}`); }
    catch (err) { return showError(err); }
    if ($('date').value !== date) return; // user switched date while this was loading

    const cards = $('cards');
    cards.replaceChildren();
    if (!list.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'No entries for this day yet.';
      cards.append(p);
      return;
    }
    list.forEach((e, i) => {
      const color = COLORS[i % COLORS.length];
      const card = document.createElement('article');
      card.className = 'card';
      card.style.setProperty('--c', color);

      const body = document.createElement('button'); // keyboard access; its click bubbles to the card
      body.type = 'button';
      body.className = 'body';
      body.setAttribute('aria-haspopup', 'dialog');
      const preview = document.createElement('span');
      preview.className = 'preview';
      preview.textContent = e.text; // textContent, never innerHTML: user text is not markup
      body.append(preview);

      const time = document.createElement('time');
      time.dateTime = e.created_at;
      time.textContent = shortTime(e.created_at);

      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Delete entry');
      del.onclick = () => deleteEntry(e.id);

      card.onclick = ev => {
        if (ev.target.closest('.del') || getSelection().toString()) return;
        openEntry(card, e, color);
      };
      card.append(body, time, del);
      cards.append(card);
    });
  }

  $('form').onsubmit = async ev => {
    ev.preventDefault();
    const text = $('text').value.trim();
    if (!text) return;
    $('add').disabled = true;
    try {
      await api('/api/entries', { method: 'POST', body: JSON.stringify({ date: $('date').value, text }) });
      $('text').value = '';
      showError(null);
      render();
    } catch (err) { showError(err); }
    finally { $('add').disabled = false; }
  };
  $('text').onkeydown = ev => { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) $('form').requestSubmit(); };
  $('date').onchange = () => { if (!$('date').value) $('date').value = todayStr(); render(); };
  $('today').onclick = () => { $('date').value = todayStr(); render(); };
  $('logout').onclick = async () => { await fetch('/api/logout', { method: 'POST' }); location.replace('/login'); };

  api('/api/me').then(me => { $('who').textContent = `Signed in as ${me.email}`; }).catch(() => {});
  $('date').value = todayStr();
  render();
</script>
</body>
</html>
