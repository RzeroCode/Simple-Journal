<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Daily Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/theme.js"></script>
</head>
<body class="login-page">
<main>
  <h1>Daily Journal</h1>
  <p class="sub" id="subtitle">Welcome back. Log in to see your entries.</p>

  <form class="panel" id="form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" minlength="8" required>
      <span class="hint" id="pwhint" hidden>At least 8 characters.</span>
    </div>
    <button type="submit" id="submit">Log in</button>
    <p class="error" id="error" role="alert"></p>
  </form>

  <p class="switch"><span id="switchText">No account yet?</span> <button type="button" class="link" id="switch">Create one</button></p>
</main>

<script src="/static/login.js"></script>
</body>
</html>
