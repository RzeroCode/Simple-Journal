<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Daily Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<style>
  main { max-width: 420px; padding-top: 12vh; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .panel button[type=submit] { width: 100%; margin-top: 6px; }
  .switch { text-align: center; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>Daily Journal</h1>
  <p class="sub" id="subtitle">Welcome back. Log in to see your entries.</p>

  <form class="panel" id="form" novalidate>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" minlength="8" required>
      <span class="hint" id="pwhint" hidden>At least 8 characters.</span>
    </div>
    <button type="submit" id="submit">Log in</button>
    <p class="error" id="error" role="alert"></p>
  </form>

  <p class="switch"><span id="switchText">No account yet?</span> <button type="button" class="link" id="switch">Create one</button></p>
</main>

<script>
  const $ = id => document.getElementById(id);
  let mode = 'login';

  $('switch').onclick = () => {
    mode = mode === 'login' ? 'register' : 'login';
    const reg = mode === 'register';
    $('subtitle').textContent = reg ? 'Create an account to start your journal.' : 'Welcome back. Log in to see your entries.';
    $('submit').textContent = reg ? 'Create account' : 'Log in';
    $('switchText').textContent = reg ? 'Already have an account?' : 'No account yet?';
    $('switch').textContent = reg ? 'Log in' : 'Create one';
    $('password').autocomplete = reg ? 'new-password' : 'current-password';
    $('pwhint').hidden = !reg;
    $('error').textContent = '';
  };

  $('form').onsubmit = async ev => {
    ev.preventDefault();
    const email = $('email').value.trim(), password = $('password').value;
    if (!email || !password) return $('error').textContent = 'Please enter your email and password.';
    if (mode === 'register' && password.length < 8) return $('error').textContent = 'Password must be at least 8 characters.';

    $('submit').disabled = true;
    $('error').textContent = '';
    try {
      const res = await fetch(mode === 'login' ? '/api/login' : '/api/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      if (res.ok) return location.replace('/');
      const body = await res.json().catch(() => ({}));
      $('error').textContent = typeof body.detail === 'string' ? body.detail
        : res.status === 422 ? 'Please enter a valid email and a password of at least 8 characters.'
        : 'Something went wrong. Please try again.';
    } catch {
      $('error').textContent = 'Could not reach the server. Is it running?';
    } finally {
      $('submit').disabled = false;
    }
  };
</script>
</body>
</html>
