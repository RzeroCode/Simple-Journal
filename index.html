<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #1e1b4b; --bg2: #4c1d95; --bg3: #be185d;
    --card: rgba(255,255,255,0.10); --border: rgba(255,255,255,0.18);
    --text: #f8fafc; --muted: #cbd5e1; --accent: #f472b6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    background-attachment: fixed;
  }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 80px; }
  h1 { font-family: Fraunces, Georgia, serif; font-size: clamp(2.2rem, 6vw, 3.4rem); margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 20px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  label { font-size: .9rem; color: var(--muted); }
  input[type=date], textarea {
    font: inherit; color: var(--text); background: rgba(0,0,0,0.25);
    border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
  }
  input[type=date] { color-scheme: dark; }
  textarea { width: 100%; min-height: 110px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; font-weight: 500; cursor: pointer; border: 0; border-radius: 12px;
    padding: 10px 18px; color: #1e1b4b; background: linear-gradient(90deg, #f9a8d4, #fde68a);
    transition: transform .15s;
  }
  button:hover { transform: translateY(-1px); }
  .link { background: none; color: var(--muted); padding: 6px 8px; text-decoration: underline; }
  .actions { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 8px; flex-wrap: wrap; }
  .hint { font-size: .8rem; color: var(--muted); }
  h2 { font-family: Fraunces, Georgia, serif; font-size: 1.4rem; margin: 40px 0 16px; }
  .cards { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .card {
    position: relative; background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 18px 18px 14px; border-top: 4px solid var(--c);
    animation: pop .25s ease-out; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .card time { display: block; font-size: .75rem; color: var(--muted); margin-top: 12px; }
  .card .del {
    position: absolute; top: 8px; right: 8px; background: none; color: var(--muted);
    padding: 2px 8px; font-size: 1.1rem; line-height: 1;
  }
  .card .del:hover { color: #fff; transform: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .empty { color: var(--muted); text-align: center; padding: 32px; border: 1px dashed var(--border); border-radius: 18px; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } button { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Daily Journal</h1>
  <p class="sub">Pick a day, write a thought. Entries live only in this tab.</p>

  <form class="panel" id="form">
    <div class="row">
      <label for="date">Date</label>
      <input type="date" id="date" required>
      <button type="button" class="link" id="today">Today</button>
    </div>
    <label for="text" class="sr">What's on your mind?</label>
    <textarea id="text" placeholder="Write something..." required></textarea>
    <div class="actions">
      <span class="hint">Ctrl + Enter to save</span>
      <button type="submit">Add entry</button>
    </div>
  </form>

  <h2 id="heading"></h2>
  <div class="cards" id="cards" aria-live="polite"></div>
</main>

<script>
  const KEY = 'journal-entries';
  const COLORS = ['#f472b6', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa', '#fb7185'];
  const $ = id => document.getElementById(id);

  // Local date, not toISOString(), which is UTC and can give yesterday's date.
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };

  // sessionStorage: survives refresh, cleared when the tab closes (by design for now).
  function load() {
    try { return JSON.parse(sessionStorage.getItem(KEY)) || []; } catch { return []; }
  }
  function save(entries) {
    try { sessionStorage.setItem(KEY, JSON.stringify(entries)); } catch { /* storage blocked: keep in memory only */ }
  }

  let entries = load();

  function render() {
    const date = $('date').value;
    const pretty = new Date(date + 'T00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
    $('heading').textContent = date === todayStr() ? `Today · ${pretty}` : pretty;

    const list = entries.filter(e => e.date === date);
    const cards = $('cards');
    cards.replaceChildren();
    if (!list.length) {
      const p = document.createElement('p');
      p.className = 'empty';
      p.textContent = 'No entries for this day yet.';
      cards.append(p);
      return;
    }
    list.forEach((e, i) => {
      const card = document.createElement('article');
      card.className = 'card';
      card.style.setProperty('--c', COLORS[i % COLORS.length]);
      card.textContent = e.text; // textContent, never innerHTML: user text is not markup
      const time = document.createElement('time');
      time.textContent = new Date(e.created).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Delete entry');
      del.onclick = () => { entries = entries.filter(x => x.id !== e.id); save(entries); render(); };
      card.append(time, del);
      cards.append(card);
    });
  }

  $('form').onsubmit = ev => {
    ev.preventDefault();
    const text = $('text').value.trim();
    if (!text) return;
    entries.push({ id: crypto.randomUUID(), date: $('date').value, text, created: Date.now() });
    save(entries);
    $('text').value = '';
    render();
  };
  $('text').onkeydown = ev => { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) $('form').requestSubmit(); };
  $('date').onchange = () => { if (!$('date').value) $('date').value = todayStr(); render(); };
  $('today').onclick = () => { $('date').value = todayStr(); render(); };

  $('date').value = todayStr();
  render();
</script>
</body>
</html>
